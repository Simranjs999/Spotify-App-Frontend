<div class="form-container">
  <div class="form-card">
    <header class="form-header">
      <h2>{{ artistId ? 'Edit Artist' : 'Create New Artist' }}</h2>
      <p>Please fill out the artist's details below.</p>
    </header>

    <form [formGroup]="artistForm" (ngSubmit)="saveArtist()">
      <div class="form-group">
        <label for="name">Artist Name</label>
        <input id="name" type="text" formControlName="name" class="form-control" placeholder="e.g., The Lumineers" required />
      </div>

      <div class="form-group">
        <label for="biography">Biography</label>
        <textarea id="biography" formControlName="biography" class="form-control" placeholder="Enter a short biography for the artist..." rows="5"></textarea>
      </div>

      <div class="form-actions">
        <button type="button" class="btn btn-secondary" (click)="goBack()">Cancel</button>
        <button type="submit" class="btn btn-primary" [disabled]="!artistForm.valid">
          <i class="fas fa-save"></i> {{ artistId ? 'Save Changes' : 'Create Artist' }}
        </button>
      </div>
    </form>
  </div>
</div>
